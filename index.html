<!doctype html><!-- What: Document Type Declaration. Why: Browsers render the page in standards mode only with a doctype. How: This declares HTML5. -->



<html lang='en'><!-- What: Root HTML Element. Why: Screen readers and translation tools need the page's language. How: This marks the document as English. -->


	<head><!-- What: Document Head Element. Why: The page's metadata, icons, social tags, and structured data load before the body paints. How: This holds them in the sections below. -->


		<!-- #region Document -->

		<meta charset='UTF-8' />                                                   <!-- What: Character Set Meta. Why: The browser has to decode the page as UTF-8 before it reads anything else. How: This sits first in the head, inside the first 1,024 bytes the browser checks. -->
		<meta name='viewport' content='width=device-width, initial-scale=1.0' />   <!-- What: Viewport Meta. Why: Phones should lay the site out at device width instead of a zoomed-out desktop width. How: This sets the layout width to the device's and starts at no zoom. -->
		<title>Lilah &amp; Norah, the Bernie Bears | Bernese Mountain Dogs</title> <!-- What: Page Title Element. Why: Link checkers and crawlers that never run the site's script read only this file, so it carries the home page's title in full. How: Every other page renders its own title, which React 19 places ahead of this one. -->

		<!-- #endregion Document -->


		<!-- #region Search -->

		<!--
			index.html = Search Section

			@summary
			Each page renders its own canonical link or noindex tag, and every
			page but Home its own title, since React 19 adds those beside any
			in this file rather than replacing them. So this section holds no
			canonical or robots tag, and the title above is the home page's.

			@author z4nta0 <https://github.com/z4nta0>

		-->



		<meta name='author'      content='The Bernie Bears' /> <!-- What: Author Meta. Why: Search engines and link preview inspectors look for who a page belongs to, and on a real brand's site that's the brand itself. How: This names The Bernie Bears. -->
		<meta name='description' content='Meet Lilah and Norah, two Bernese Mountain Dog sisters sharing bear hugs, silly videos, and fluffy fun. Follow along!' /> <!-- What: Description Meta. Why: Search listings show a summary under the title, and checkers and crawlers that never run the site's script read only this file. How: This carries the home page's description, the one description tag the site has, which the Social Links page swaps for its own while it shows. -->

		<!-- #endregion Search -->


		<!-- #region Web App -->

		<meta name='theme-color' content='#d1afe2' /> <!-- What: Theme Color Meta. Why: Mobile browsers tint their chrome around the page, and Discord edges its link previews in this color. How: This sets it to the brand lavender, the site's main accent. -->

		<!-- #endregion Web App -->


		<!-- #region Icons -->

		<!--
			index.html = Icons Section

			@summary
			The SVG comes first, since modern browsers prefer it and it stays
			sharp at any tab density, then the root favicon.ico for older
			browsers, then the PNG sizes from smallest to largest. Every raster
			icon is rendered from favicon.svg by npm run icons. The order is
			the browser's order of preference, so it stays as written rather
			than alphabetical.

			@author z4nta0 <https://github.com/z4nta0>

		-->



		<link href='/favicon.svg'         rel='icon' type='image/svg+xml' />             <!-- What: SVG Icon Link. Why: Modern browsers prefer a vector favicon that stays sharp at any tab density. How: This points at the pink paw print in public/. -->
		<link href='/favicon.ico'         rel='icon' sizes='any' />                      <!-- What: ICO Icon Link. Why: Older browsers read only a .ico favicon. How: This points at the root favicon.ico, which also answers the request browsers make for it on their own. -->
		<link href='/favicon-16x16.png'   rel='icon' sizes='16x16'   type='image/png' /> <!-- What: Small PNG Icon Link. Why: Small tab icons look crisper drawn at their own size. How: This offers the 16px PNG. -->
		<link href='/favicon-32x32.png'   rel='icon' sizes='32x32'   type='image/png' /> <!-- What: Medium PNG Icon Link. Why: A browser without SVG favicons needs a raster fallback, and most pick a 32px tab icon. How: This offers the 32px PNG. -->
		<link href='/favicon-192x192.png' rel='icon' sizes='192x192' type='image/png' /> <!-- What: Large PNG Icon Link. Why: Some browsers and Android pick a large icon for shortcuts and tab previews. How: This offers the 192px PNG. -->
		<link href='/favicon-512x512.png' rel='icon' sizes='512x512' type='image/png' /> <!-- What: Extra Large PNG Icon Link. Why: High-density screens and app launchers can ask for a bigger icon still. How: This offers the 512px PNG. -->

		<!-- #endregion Icons -->


		<!-- #region Home Screen -->

		<link href='/apple-touch-icon.png' rel='apple-touch-icon' sizes='180x180' /> <!-- What: Apple Touch Icon Link. Why: iOS draws the home screen icon, and some apps the icon beside a shared link, from this link. How: This points at the 180px touch icon, the paw on white. -->

		<!-- #endregion Home Screen -->


		<!-- #region Open Graph -->

		<!--
			index.html = Open Graph Section

			@summary
			Link scrapers read only this file and never run the site's script,
			so every page shares this one card, describing the home page: its
			title and description, and the card npm run og-image renders. A
			page that ever needs a card of its own would need the site
			prerendered first.

			@author z4nta0 <https://github.com/z4nta0>

		-->



		<meta property='og:description'  content='Meet Lilah and Norah, two Bernese Mountain Dog sisters sharing bear hugs, silly videos, and fluffy fun. Follow along!' /> <!-- What: Open Graph Description Meta. Why: A shared link shows a summary under its title. How: This matches the home page's description. -->
		<meta property='og:image'        content='https://theberniebears.dog/og-image.jpg' />                                                      <!-- What: Open Graph Image Meta. Why: A shared link shows a preview image. How: This points at the 1,200x630 card in public/, by its absolute address, since scrapers can't resolve a relative one. -->
		<meta property='og:image:alt'    content='Cartoon logo of Lilah and Norah, The Bernie Bears, above the words Follow Lilah &amp; Norah.' /> <!-- What: Open Graph Image Alt Meta. Why: Screen readers on social sites read the preview image's description. How: This describes the card. -->
		<meta property='og:image:height' content='630' />                                                                                          <!-- What: Open Graph Image Height Meta. Why: Sites can lay out the preview before the image loads. How: This gives the card's height. -->
		<meta property='og:image:type'   content='image/jpeg' />                                                                                   <!-- What: Open Graph Image Type Meta. Why: Some apps check an image's type before fetching it. How: This names JPEG, which keeps the card small. -->
		<meta property='og:image:width'  content='1200' />                                                                                         <!-- What: Open Graph Image Width Meta. Why: Sites can lay out the preview before the image loads. How: This gives the card's width. -->
		<meta property='og:locale'       content='en_US' />                                                                                        <!-- What: Open Graph Locale Meta. Why: Sites can tell which language the page is in. How: This names US English. -->
		<meta property='og:site_name'    content='The Bernie Bears' />                                                                             <!-- What: Open Graph Site Name Meta. Why: Previews show which site a link belongs to. How: This names the brand. -->
		<meta property='og:title'        content='Lilah &amp; Norah, the Bernie Bears | Bernese Mountain Dogs' />                                  <!-- What: Open Graph Title Meta. Why: A shared link shows a title. How: This matches the home page's title. -->
		<meta property='og:type'         content='website' />                                                                                      <!-- What: Open Graph Type Meta. Why: Sites shape a preview by what kind of page it is. How: This marks it a website. -->
		<meta property='og:url'          content='https://theberniebears.dog/' />                                                                  <!-- What: Open Graph URL Meta. Why: Shares from any address should count as one page. How: This names the live address, matching the home page's canonical link. -->

		<!-- #endregion Open Graph -->


		<!-- #region Twitter Card -->

		<meta name='twitter:card'        content='summary_large_image' />                                                                          <!-- What: Twitter Card Meta. Why: X and similar sites pick a preview layout from this tag. How: This asks for the large image layout, which suits the 1,200x630 card. -->
		<meta name='twitter:description' content='Meet Lilah and Norah, two Bernese Mountain Dog sisters sharing bear hugs, silly videos, and fluffy fun. Follow along!' /> <!-- What: Twitter Description Meta. Why: The preview shows a summary. How: This matches the home page's description. -->
		<meta name='twitter:image'       content='https://theberniebears.dog/og-image.jpg' />                                                      <!-- What: Twitter Image Meta. Why: The preview shows an image. How: This points at the same card as Open Graph. -->
		<meta name='twitter:image:alt'   content='Cartoon logo of Lilah and Norah, The Bernie Bears, above the words Follow Lilah &amp; Norah.' /> <!-- What: Twitter Image Alt Meta. Why: Screen readers read the preview image's description. How: This describes the card. -->
		<meta name='twitter:site'        content='@theberniebears' />                                                                              <!-- What: Twitter Site Meta. Why: A preview on X can name the account behind the site, and the brand has a real one. How: This names @theberniebears, the X profile the Social Links page lists. -->
		<meta name='twitter:title'       content='Lilah &amp; Norah, the Bernie Bears | Bernese Mountain Dogs' />                                  <!-- What: Twitter Title Meta. Why: The preview shows a title. How: This matches the home page's title. -->

		<!-- #endregion Twitter Card -->


		<!-- #region Structured Data -->

		<script type='application/ld+json'>
			{
				"@context": "https://schema.org",
				"@graph": [
					{
						"@type": "Organization",
						"@id": "https://theberniebears.com/#organization",
						"name": "The Bernie Bears",
						"url": "https://theberniebears.com/",
						"email": "hello@theberniebears.com",
						"logo": "https://theberniebears.dog/favicon-512x512.png",
						"image": "https://theberniebears.dog/og-image.jpg",
						"sameAs": [
							"https://www.instagram.com/theberniebears",
							"https://www.youtube.com/@theberniebears",
							"https://www.tiktok.com/@theberniebears",
							"https://x.com/theberniebears",
							"https://www.pinterest.com/theberniebears/",
							"https://www.facebook.com/theberniebears"
						]
					},
					{
						"@type": "WebSite",
						"@id": "https://theberniebears.dog/#website",
						"name": "The Bernie Bears",
						"url": "https://theberniebears.dog/",
						"inLanguage": "en-US",
						"publisher": {
							"@id": "https://theberniebears.com/#organization"
						}
					}
				]
			}
		</script><!-- What: Site Structured Data Script. Why: Search engines read JSON-LD to tell who a site belongs to, and this site should point them at the brand's main site rather than compete with it. How: This describes this domain as a WebSite published by The Bernie Bears, an Organization whose home is theberniebears.com, with the email the Contact page shows and the six profiles the Social Links page lists. -->

		<!-- #endregion Structured Data -->


	</head>



	<body><!-- What: Document Body Element. Why: This holds the site's mount point and the entry script. How: The mount point stays empty until React renders the site into it. -->


		<div id='appMouDiv'></div><!-- What: App Mount Div Element. Why: React needs one element to render the site into. How: main.tsx renders the app into this id. -->

		<script
			src='/src/main.tsx'
			type='module'
		>/* What: Site Module Script Element. Why: This loads the site itself. How: Vite replaces it with the built, hashed bundle at build time. */</script>


	</body>


</html>
